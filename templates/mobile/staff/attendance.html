{% extends 'mobile/staff/base.html' %}
{% block title %}Attendance{% endblock %}
{% block body %}
<div class="card">
    <h2>Attendance</h2>
</div>
{% for class in classes %}
<div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
        <div><strong>{{ class.name }} - {{ class.section }}</strong></div>
        <a class="btn-primary" href="{% url 'staff_attendance_mark' class_id=class.id attendance_date='2026-08-30' %}" style="text-decoration:none; padding: 0.5rem 0.8rem; border-radius: 0.65rem; font-size: 0.8rem;">Take</a>
    </div>
</div>
{% empty %}
<div class="card"><p class="text-secondary">No classes assigned.</p></div>
{% endfor %}
{% endblock %}
