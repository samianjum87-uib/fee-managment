{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{% block title %}AXIS Staff Portal{% endblock %}</title>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-alt: #eef4ff;
            --text: #0f172a;
            --muted: #475569;
            --border: #e2e8f0;
            --accent: #2563eb;
            --accent-strong: #1d4ed8;
            --success: #16a34a;
            --warning: #f59e0b;
            --danger: #dc2626;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        a { color: inherit; }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.96);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(8px);
        }
        .brand {
            font-weight: 700;
            letter-spacing: 0.01em;
        }
        .nav {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .nav a {
            text-decoration: none;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 8px;
            border-radius: 8px;
        }
        .nav a.active, .nav a:hover {
            color: var(--accent);
            background: var(--surface-alt);
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 16px;
            margin-bottom: 14px;
        }
        .subtle { color: var(--muted); }
        .btn, button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            border-radius: 12px;
            padding: 10px 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-primary, button[type="submit"] {
            background: var(--accent);
            color: white;
        }
        .btn-secondary {
            background: var(--surface-alt);
            color: var(--text);
        }
        .danger { color: var(--danger); }
        .alert {
            padding: 10px 12px;
            border-left: 4px solid var(--accent);
            background: rgba(37, 99, 235, 0.08);
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .stack { display: grid; gap: 12px; }
        input, select, textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 12px;
            font: inherit;
            background: #fff;
            color: var(--text);
        }
        .password-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .password-row input {
            flex: 1;
        }
        .toggle-eye {
            border: 1px solid var(--border);
            background: var(--surface-alt);
            color: var(--text);
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            min-width: 44px;
        }
        @media (max-width: 480px) {
            .nav { gap: 4px; }
            .nav a { font-size: 11px; padding: 5px 6px; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="topbar">
        <div class="brand">AXIS Staff Portal</div>
        <div class="nav">
            <a href="{% url 'staff_dashboard' %}" class="{% if request.path == '/portal/staff/dashboard/' %}active{% endif %}">Dashboard</a>
            <a href="{% url 'staff_classes' %}" class="{% if '/portal/staff/classes/' in request.path %}active{% endif %}">Classes</a>
            <a href="{% url 'staff_attendance_list' %}" class="{% if '/portal/staff/attendance/' in request.path %}active{% endif %}">Attendance</a>
            <a href="{% url 'staff_notifications' %}" class="{% if '/portal/staff/notifications/' in request.path %}active{% endif %}">Alerts</a>
            <a href="{% url 'staff_profile_page' %}" class="{% if '/portal/staff/profile/' in request.path %}active{% endif %}">Profile</a>
            <a href="{% url 'staff_logout' %}">Logout</a>
        </div>
    </div>
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block body %}{% endblock %}
    </div>
</body>
</html>
