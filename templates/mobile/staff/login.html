{% extends 'mobile/base.html' %}
{% block body %}
<div class="card" style="max-width: 420px; margin: 42px auto 0;">
    <h2 style="margin-bottom: 8px;">AXIS Staff Portal</h2>
    <p class="text-secondary" style="margin-bottom: 18px;">Sign in with your school staff credentials.</p>
    {% if error %}
        <div class="message error">{{ error }}</div>
    {% endif %}
    <form method="post" style="display: grid; gap: 12px;">
        {% csrf_token %}
        <div>
            <label for="username" style="display:block; margin-bottom:6px; font-weight:600;">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required style="width:100%; padding: 0.8rem 0.9rem; border:1px solid var(--border); border-radius:0.75rem; background: var(--surface); color: var(--text);">
        </div>
        <div>
            <label for="password" style="display:block; margin-bottom:6px; font-weight:600;">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required style="width:100%; padding: 0.8rem 0.9rem; border:1px solid var(--border); border-radius:0.75rem; background: var(--surface); color: var(--text);">
        </div>
        <button type="submit" class="btn-primary" style="width:100%; padding: 0.8rem 1rem; border-radius: 0.8rem; font-weight: 600;">Login</button>
    </form>
</div>
{% endblock %}
