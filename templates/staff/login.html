{% extends 'staff/base.html' %}
{% block title %}Staff Login{% endblock %}
{% block content %}
<div class="card" style="max-width:420px; margin:52px auto 0;">
    <h1 style="margin: 0 0 10px; text-align:center;">AXIS Staff</h1>
    <div class="muted" style="text-align:center; margin-bottom:18px;">Login with your staff credentials</div>
    {% if error %}<div class="alert" style="background: rgba(220,38,38,.08); color:#991b1b; border-left-color:#dc2626;">{{ error }}</div>{% endif %}
    <form method="post" style="display:grid; gap:12px;">
        {% csrf_token %}
        <div>
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>
        </div>
        <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
</div>
{% endblock %}
