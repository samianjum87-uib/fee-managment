{% load static %}
<!-- Global Search Bar -->
<div class="global-search-wrapper" id="globalSearchWrapper">
    <div class="search-input-container">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" id="globalSearchInput" placeholder="Search students, fees, payments, products..." autocomplete="off" aria-label="Global search">
        <div id="searchLoading" style="display:none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
            </svg>
        </div>
        <button id="clearSearchBtn" style="display:none; background:none; border:none; cursor:pointer; color:var(--muted);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </div>
    <div id="searchResultsDropdown" class="search-dropdown" style="display:none;">
        <div id="searchResultsList">
            <!-- Results will be rendered here -->
        </div>
        <div id="searchEmpty" style="display:none; padding:0.8rem; color:var(--muted); text-align:center;">
            No results found
        </div>
        <div id="searchError" style="display:none; padding:0.8rem; color:var(--danger); text-align:center;">
            Error loading results
        </div>
    </div>
</div>

<style>
    .global-search-wrapper {
        position: relative;
        width: 100%;
    }
    .search-input-container {
        display: flex;
        align-items: center;
        background: var(--surface-alt);
        border-radius: 2rem;
        border: 1px solid var(--border);
        padding: 0.2rem 0.75rem;
        transition: border-color 0.2s, box-shadow 0.2s;
        position: relative;
    }
    .search-input-container:focus-within {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
    }
    .search-input-container .search-icon {
        color: var(--muted);
        flex-shrink: 0;
        margin-right: 0.5rem;
    }
    .search-input-container input {
        flex: 1;
        border: none;
        background: transparent;
        padding: 0.5rem 0;
        font-size: 0.9rem;
        color: var(--text);
        outline: none;
        min-width: 100px;
    }
    .search-input-container input::placeholder {
        color: var(--muted);
        font-weight: 400;
    }
    #searchLoading {
        display: none;
        margin-left: 0.5rem;
        animation: spin 1s linear infinite;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    #clearSearchBtn {
        margin-left: 0.5rem;
        color: var(--muted);
        padding: 0.2rem;
        border-radius: 50%;
        transition: background 0.2s;
    }
    #clearSearchBtn:hover {
        background: var(--surface);
    }
    .search-dropdown {
        position: absolute;
        top: calc(100% + 0.5rem);
        left: 0;
        right: 0;
        background: var(--surface);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 1rem;
        box-shadow: 0 12px 40px rgba(0,0,0,0.12);
        max-height: 400px;
        overflow-y: auto;
        z-index: 1000;
        display: none;
    }
    .search-dropdown.open {
        display: block;
    }
    .search-result-section {
        padding: 0.4rem 0;
    }
    .search-result-section .section-header {
        font-size: 0.7rem;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--muted);
        padding: 0.3rem 1rem;
        background: var(--surface-alt);
        border-bottom: 1px solid var(--border);
        letter-spacing: 0.5px;
    }
    .search-result-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 1rem;
        cursor: pointer;
        transition: background 0.15s;
        border-bottom: 1px solid var(--border);
        text-decoration: none;
        color: var(--text);
    }
    .search-result-item:last-child {
        border-bottom: none;
    }
    .search-result-item:hover {
        background: var(--surface-alt);
    }
    .search-result-item .item-title {
        font-weight: 500;
        font-size: 0.9rem;
    }
    .search-result-item .item-sub {
        font-size: 0.75rem;
        color: var(--muted);
    }
    .search-result-item .item-badge {
        font-size: 0.65rem;
        padding: 0.15rem 0.5rem;
        border-radius: 2rem;
        background: rgba(79,70,229,0.1);
        color: var(--primary);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        flex-shrink: 0;
        margin-left: 0.5rem;
    }
    .search-dropdown .empty-message {
        padding: 1.5rem;
        text-align: center;
        color: var(--muted);
    }
    /* Scrollbar */
    .search-dropdown::-webkit-scrollbar {
        width: 6px;
    }
    .search-dropdown::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
    }
    .search-dropdown::-webkit-scrollbar-track {
        background: transparent;
    }
</style>

{% if tenant and tenant.schema_name %}
<script>
    (function() {
        const searchInput = document.getElementById('globalSearchInput');
        const dropdown = document.getElementById('searchResultsDropdown');
        const resultsList = document.getElementById('searchResultsList');
        const emptyMsg = document.getElementById('searchEmpty');
        const errorMsg = document.getElementById('searchError');
        const loading = document.getElementById('searchLoading');
        const clearBtn = document.getElementById('clearSearchBtn');
        const schema = '{{ tenant.schema_name }}';

        let debounceTimeout = null;
        let currentQuery = '';

        function showLoading() {
            loading.style.display = 'inline-block';
        }

        function hideLoading() {
            loading.style.display = 'none';
        }

        function clearResults() {
            resultsList.innerHTML = '';
            emptyMsg.style.display = 'none';
            errorMsg.style.display = 'none';
            dropdown.classList.remove('open');
            dropdown.style.display = 'none';
            clearBtn.style.display = 'none';
        }

        function renderResults(data) {
            resultsList.innerHTML = '';
            let total = 0;
            const sections = [
                { key: 'students', label: 'Students' },
                { key: 'fees', label: 'Fee Records' },
                { key: 'payments', label: 'Payments' },
                { key: 'products', label: 'Products' },
                { key: 'categories', label: 'Categories' },
            ];
            for (let sec of sections) {
                const items = data[sec.key] || [];
                if (items.length === 0) continue;
                total += items.length;
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'search-result-section';
                const header = document.createElement('div');
                header.className = 'section-header';
                header.textContent = sec.label;
                sectionDiv.appendChild(header);
                for (let item of items) {
                    const link = document.createElement('a');
                    link.className = 'search-result-item';
                    link.href = item.url;
                    let title = item.title || item.name || item.label || 'Item';
                    let sub = item.subtitle || '';
                    let badge = item.type || sec.label.slice(0, -1);
                    link.innerHTML = `
                        <div>
                            <div class="item-title">${title}</div>
                            <div class="item-sub">${sub}</div>
                        </div>
                        <span class="item-badge">${badge}</span>
                    `;
                    sectionDiv.appendChild(link);
                }
                resultsList.appendChild(sectionDiv);
            }

            if (total === 0) {
                emptyMsg.style.display = 'block';
                dropdown.style.display = 'block';
                dropdown.classList.add('open');
                return;
            }

            emptyMsg.style.display = 'none';
            dropdown.style.display = 'block';
            dropdown.classList.add('open');
        }

        function performSearch(query) {
            if (!query || query.trim().length < 2) {
                clearResults();
                return;
            }
            currentQuery = query.trim();
            showLoading();
            clearBtn.style.display = 'inline-block';
            (function() {
            let url = `/portal/${schema}/api/global-search/?q=${encodeURIComponent(currentQuery)}`;
            if (window.location.pathname.includes('/mobile/')) {
                url += '&mobile=1';
            }
            return fetch(url);
        })()
                .then(res => res.json())
                .then(data => {
                    hideLoading();
                    if (data.error) {
                        errorMsg.textContent = data.error;
                        errorMsg.style.display = 'block';
                        dropdown.style.display = 'block';
                        dropdown.classList.add('open');
                        return;
                    }
                    renderResults(data);
                })
                .catch(err => {
                    hideLoading();
                    errorMsg.textContent = 'Error: ' + err.message;
                    errorMsg.style.display = 'block';
                    dropdown.style.display = 'block';
                    dropdown.classList.add('open');
                });
        }

        searchInput.addEventListener('input', function(e) {
            const query = this.value;
            if (debounceTimeout) clearTimeout(debounceTimeout);
            debounceTimeout = setTimeout(() => {
                performSearch(query);
            }, 300);
        });

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                clearResults();
                this.blur();
            }
            const items = dropdown.querySelectorAll('.search-result-item');
            if (items.length === 0) return;
            let currentIndex = -1;
            items.forEach((el, idx) => {
                if (el === document.activeElement) currentIndex = idx;
            });
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                const nextIndex = Math.min(currentIndex + 1, items.length - 1);
                if (currentIndex !== -1) items[currentIndex].blur();
                items[nextIndex].focus();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                const prevIndex = Math.max(currentIndex - 1, 0);
                if (currentIndex !== -1) items[currentIndex].blur();
                items[prevIndex].focus();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (document.activeElement && document.activeElement.closest('.search-result-item')) {
                    document.activeElement.click();
                }
            }
        });

        document.addEventListener('click', function(e) {
            const wrapper = document.getElementById('globalSearchWrapper');
            if (!wrapper.contains(e.target)) {
                clearResults();
            }
        });

        clearBtn.addEventListener('click', function() {
            searchInput.value = '';
            clearResults();
            searchInput.focus();
        });

        searchInput.addEventListener('blur', function() {
            setTimeout(() => {
                if (this.value.trim() === '') {
                    clearResults();
                }
            }, 200);
        });

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && document.activeElement === this) {
                const firstItem = dropdown.querySelector('.search-result-item');
                if (firstItem) {
                    e.preventDefault();
                    firstItem.click();
                }
            }
        });

    })();
</script>
{% endif %}
